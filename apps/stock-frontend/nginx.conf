# stock-frontend: static SPA + /api reverse proxy to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Resolve via Docker's embedded DNS at request time (survives backend re-creates).
        resolver 127.0.0.11 valid=30s;
        set $backend http://stock-backend:8765;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        # ML endpoints (e.g. /api/recommend/top trains 53 models) take minutes on a Pi 4.
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
