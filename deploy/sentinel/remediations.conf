# remediations.conf — the Sentinel agent's accumulated playbook (outage pattern knowledge).
# Format: service|first-try action|notes learned from past incidents
# The Sentinel agent reads this BEFORE acting and updates the notes column when it learns
# something; the CTO syncs curated entries back into the repo copy.
*|compose restart|default: restart, verify endpoint, escalate to recreate (up -d) if a second restart would be needed
pihole|compose restart|production DNS for the house — fix fast, never leave stopped. 2026-06-11: "down" was actually the owner manually stopping jsms containers, NOT pihole; check whether an outage is really ours before acting
cc-points|compose restart|Next.js standalone, ~30s to "Ready in" after start. 2026-06-12: 500s on every page = Prisma openssl engine mismatch (fixed in Dockerfile; if it recurs, image was rebuilt wrong — NEEDS-CTO)
stock-backend|compose restart|FastAPI. Heavy ML endpoints (/api/recommend/top trains 53 models) pin CPU for minutes — a slow /api/health during that is NOT an outage; check docker stats before restarting
stock-frontend|compose restart|nginx + static SPA; almost never the culprit — if /api calls fail, look at stock-backend first
homepage|compose restart|writes logs/ into its bind-mounted config dir as root (known rsync-deploy conflict, see repo LEARNINGS)
grafana|compose restart|GF_SECURITY_ADMIN_PASSWORD only applies on first boot of an empty volume
prometheus|compose restart|mounted prometheus.yml does NOT hot-reload; restart after config deploys is expected, not an outage
loki|compose restart|503 on /ready for ~2-3 min after host boot or container (re)start = warming up, NOT an outage — wait before acting (2026-06-12 reboot)
host-reboot|verify all, fix stragglers|2026-06-12 lessons: compose services self-recover; clock boots ~30 min in the past until ntpd syncs (if ntpq shows 'reach 0', restart ntp — it races pihole DNS at boot); jsms_worker-au restart policy forced to 'no' so reboots keep it dead — if ANY jsms/auto-named container is RUNNING post-boot, stop it and check its restart policy
host-disk|prune images+builder|2026-06-12: docker builder prune freed 12.13GB (132 stale cache entries); check docker system df before assuming the SD card is full
host-temp|none|report only — throttling is the Pi protecting itself; if sustained >70C, NEEDS-CTO (cooling)
