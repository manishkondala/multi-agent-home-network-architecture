server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # All docker container logs, labeled by container name
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: job
        replacement: docker
      - target_label: node
        replacement: pi-node1

  # Host syslog
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          node: pi-node1
          __path__: /var/log/syslog
