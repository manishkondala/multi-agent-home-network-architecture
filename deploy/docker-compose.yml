# pi-fleet stack — pi-node1 (Raspberry Pi 4, arm64)
# Deployed to ~/pi-fleet on the Pi by scripts/deploy.sh. Secrets come from .env (never in git).
name: pi-fleet

networks:
  fleet:
    name: fleet

volumes:
  pihole-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  # ---------- Product: network-wide ad blocking ----------
  pihole:
    image: pihole/pihole:2025.03.1
    container_name: pihole
    hostname: pihole
    networks: [fleet]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"      # admin UI: http://<pi>:8081/admin
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_upstreams: 1.1.1.1;1.0.0.1
      FTLCONF_dns_listeningMode: all
    volumes:
      - pihole-data:/etc/pihole
    cap_add: [SYS_NICE]
    restart: unless-stopped
    mem_limit: 512m

  pihole-exporter:
    image: ekofr/pihole-exporter:v1.2.0
    container_name: pihole-exporter
    networks: [fleet]
    environment:
      PIHOLE_HOSTNAME: pihole
      PIHOLE_PORT: "80"
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
    depends_on: [pihole]
    restart: unless-stopped
    mem_limit: 64m

  # ---------- Observability ----------
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: prometheus
    networks: [fleet]
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    mem_limit: 768m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    networks: [fleet]
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    mem_limit: 64m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: cadvisor
    networks: [fleet]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    mem_limit: 256m

  loki:
    image: grafana/loki:2.9.10
    container_name: loki
    networks: [fleet]
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    mem_limit: 512m

  promtail:
    image: grafana/promtail:2.9.10
    container_name: promtail
    networks: [fleet]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    networks: [fleet]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    restart: unless-stopped
    mem_limit: 512m

  # ---------- Owner apps (images built ON the Pi from ~/apps — see scripts/sync-apps.sh) ----------
  cc-points:
    image: cc-points:0.1.0          # local image, built on pi-node1 (never pulled)
    container_name: cc-points
    networks: [fleet]
    ports: ["3002:3000"]
    environment:
      TZ: ${TZ}
      DATABASE_URL: "file:/data/dev.db"
    volumes:
      - /home/pi/apps/data/cc-points:/data   # SQLite lives outside the image
    restart: unless-stopped
    mem_limit: 512m

  stock-backend:
    image: stock-backend:0.1.0      # local image, built on pi-node1
    container_name: stock-backend
    networks: [fleet]
    ports: ["3004:8765"]
    environment:
      TZ: ${TZ}
    volumes:
      - /home/pi/apps/data/stock-analysis:/app/data            # SQLite (portfolio/chat)
      - /home/pi/apps/secrets/stock-backend.env:/app/.env:ro   # ANTHROPIC_API_KEY (Pi-only file)
    restart: unless-stopped
    mem_limit: 1g

  stock-frontend:
    image: stock-frontend:0.1.0     # local image, built on pi-node1
    container_name: stock-frontend
    networks: [fleet]
    ports: ["3003:80"]
    depends_on: [stock-backend]
    restart: unless-stopped
    mem_limit: 64m

  # ---------- Availability probing ----------
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0   # verified linux/arm64 by pulling on the Pi
    container_name: blackbox-exporter
    networks: [fleet]
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped
    mem_limit: 64m

  # ---------- Frontend portal ----------
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.2.0
    container_name: homepage
    networks: [fleet]
    ports: ["80:3000"]
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      HOMEPAGE_VAR_PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      HOMEPAGE_VAR_HOST: ${HOMEPAGE_VAR_HOST}
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    mem_limit: 512m
