# Domain -> service mapping for the streaming-exporter.
# A query's domain is lowercased and matched if it CONTAINS any pattern below
# (substring match, first service wins by file order). DNS is domain-level only,
# so this groups the messy CDN domains each service spreads across into one label.
# Add a service or pattern here and redeploy — no code change needed.
services:
  YouTube:
    - googlevideo.com
    - youtube.com
    - youtubei.googleapis.com
    - youtube-nocookie.com
    - ytimg.com
    - yt3.ggpht.com
  Netflix:
