# Domain -> service mapping for the streaming-exporter.
# A query's domain is lowercased and matched if it CONTAINS any pattern below
# (substring match, first service wins by file order). DNS is domain-level only,
# so this groups the messy CDN domains each service spreads across into one label.
# Add a service or pattern here and redeploy — no code change needed.
#
# This is a curated ~50 of the most-used streaming apps. It is an allowlist: a
# service only shows up once it is mapped here, so a brand-new service stays
# invisible until added (this is the known limitation of DNS-based classification).
# PROPOSED (not built yet): a "top unclassified domains" exporter metric + dashboard
# panel so unmapped streaming traffic is at least visible and can be mapped here.
services:
