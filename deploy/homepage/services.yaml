# Tiles. siteMonitor probes run from inside the homepage container — use fleet-network
# hostnames there; user-facing hrefs use HOMEPAGE_VAR_HOST (injected at deploy time).
- Apps:
    - Pointly:
        icon: mdi-credit-card-multiple
        href: "http://{{HOMEPAGE_VAR_HOST}}:3002"
        description: Credit-card points dashboard
        server: my-docker
        container: cc-points
        siteMonitor: http://cc-points:3000
    - Stock Analysis:
        icon: mdi-finance
        href: "http://{{HOMEPAGE_VAR_HOST}}:3003"
        description: ML stock advisor
        server: my-docker
        container: stock-frontend
        siteMonitor: http://stock-frontend:80

- Network:
    - Pi-hole:
        icon: pi-hole.svg
        href: "http://{{HOMEPAGE_VAR_HOST}}:8081/admin"
        description: Network-wide ad blocking
        server: my-docker
        container: pihole
        siteMonitor: http://pihole:80/admin
        widget:
          type: pihole
          version: 6
          url: http://pihole:80
          key: "{{HOMEPAGE_VAR_PIHOLE_PASSWORD}}"
    - Streaming Activity:
        icon: mdi-television-play
        href: "http://{{HOMEPAGE_VAR_HOST}}:3000/d/pi-fleet-streaming/streaming-by-service"
        description: Per-device streaming by service (opens in Grafana — login required)
        server: my-docker
        container: streaming-exporter
        siteMonitor: http://streaming-exporter:9618/metrics

- Platform:
    - Grafana:
        icon: grafana.svg
        href: "http://{{HOMEPAGE_VAR_HOST}}:3000"
        description: Dashboards (admin / Keychain grafana-admin)
        server: my-docker
        container: grafana
        siteMonitor: http://grafana:3000/api/health
    - Prometheus:
        # Locked to the Pi loopback (no LAN access) — no click-through; query via Grafana.
        icon: prometheus.svg
        description: Metrics — internal only (locked); explore via Grafana
        server: my-docker
        container: prometheus
        siteMonitor: http://prometheus:9090/-/healthy
    - Loki:
        icon: loki.svg
        href: "http://{{HOMEPAGE_VAR_HOST}}:3000/explore"
        description: Logs (query via Grafana Explore)
        server: my-docker
        container: loki
        siteMonitor: http://loki:3100/ready
