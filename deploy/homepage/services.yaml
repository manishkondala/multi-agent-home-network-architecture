# Tiles. siteMonitor probes run from inside the homepage container — use fleet-network
# hostnames there; user-facing hrefs use HOMEPAGE_VAR_HOST (injected at deploy time).
- Apps:
    - Pointly:
        icon: mdi-credit-card-multiple
        href: "http://{{HOMEPAGE_VAR_HOST}}:3002"
        description: Credit-card points dashboard
        server: my-docker
        container: cc-points
        siteMonitor: http://cc-points:3000
    - Stock Analysis:
        icon: mdi-finance
        href: "http://{{HOMEPAGE_VAR_HOST}}:3003"
        description: ML stock advisor
        server: my-docker
        container: stock-frontend
        siteMonitor: http://stock-frontend:80

- Network:
    - Wi-Fi Health:
        icon: mdi-wifi-check
        href: "http://{{HOMEPAGE_VAR_HOST}}:3005"
        description: Run a Wi-Fi health check from any room
        server: my-docker
        container: wifi-health
        # Host-networked (no container DNS) — probe via the Pi's LAN IP, not a fleet hostname.
        siteMonitor: http://{{HOMEPAGE_VAR_HOST}}:3005/api/health
    - YouTube Metrics:
        icon: mdi-youtube
        # Locked: links straight into the Grafana "YouTube Metrics" dashboard (folder
        # pi-fleet/tests, uid `tests`), which is gated behind the Grafana login — only the
        # owner has the password (same gating as the v0.5 admin view / streaming dashboard).
        # Worker runs CAPPED on pi-node1 today (moves to pi-node3 when it lands).
        href: "http://{{HOMEPAGE_VAR_HOST}}:3000/d/tests/youtube-metrics"
        description: Continuous YouTube QoE tests (Grafana login required)
    - Pi-hole:
        icon: pi-hole.svg
        href: "http://{{HOMEPAGE_VAR_HOST}}:8081/admin"
        description: Network-wide ad blocking
        server: my-docker
        container: pihole
        siteMonitor: http://pihole:80/admin
        widget:
          type: pihole
          version: 6
          url: http://pihole:80
          key: "{{HOMEPAGE_VAR_PIHOLE_PASSWORD}}"

# Platform: only Grafana is surfaced (owner uses it as the single pane of glass).
# Prometheus + Loki still run as Grafana's backends — they're just not tiled here.
# The streaming view lives inside Grafana (dashboard uid pi-fleet-streaming).
- Platform:
    - Grafana:
        icon: grafana.svg
        href: "http://{{HOMEPAGE_VAR_HOST}}:3000"
        description: Dashboards (admin / Keychain grafana-admin)
        server: my-docker
        container: grafana
        siteMonitor: http://grafana:3000/api/health
